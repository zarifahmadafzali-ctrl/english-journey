name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Capacitor 7 needs JDK 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Do not install obsolete 'tools' package (default of this action; fails on current SDK)
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      # package-lock.json must include @capacitor/android; fall back to install if it is stale
      - name: Install dependencies
        run: npm ci || npm install

      - name: Unit tests
        run: npm test

      - name: Vite build
        run: npm run build

      - name: Add Android platform (only if missing)
        run: '[ -d android ] || npx cap add android'

      - name: Capacitor sync
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: english-journey-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
